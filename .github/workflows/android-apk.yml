
name: Build Joy Inbox Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Capacitor
        working-directory: frontend
        run: npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Create Capacitor config
        working-directory: frontend
        run: |
          echo '{"appId":"com.joyinbox.app","appName":"Joy Inbox","webDir":"dist"}' > capacitor.config.json

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Add Android
        working-directory: frontend
        run: npx cap add android

      - name: Sync Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Joy-Inbox-Android-APK
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          
